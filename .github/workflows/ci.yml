name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Odoo 19 module tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout module
        uses: actions/checkout@v4

      - name: Checkout Odoo 19.0
        uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: "19.0"
          path: odoo
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: odoo/requirements.txt

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libpq-dev \
            libxml2-dev \
            libxslt1-dev \
            libldap2-dev \
            libsasl2-dev \
            libssl-dev \
            libjpeg-dev \
            zlib1g-dev \
            libffi-dev \
            libcairo2-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r odoo/requirements.txt
          pip install psycopg2-binary

      - name: Run product_label_print_queue tests
        env:
          PGHOST: localhost
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          python odoo/odoo-bin \
            --addons-path=odoo/addons,. \
            --database=ci_product_label_print_queue \
            --db_host=localhost \
            --db_port=5432 \
            --db_user=odoo \
            --db_password=odoo \
            --init=product_label_print_queue \
            --test-tags=/product_label_print_queue \
            --stop-after-init \
            --without-demo=all \
            --max-cron-threads=0 \
            --http-port=8079 \
            --log-level=test
